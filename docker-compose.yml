services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_code_reviewer}
      POSTGRES_USER: ${POSTGRES_USER:-ai_code_reviewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_code_reviewer}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_code_reviewer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Django app itself — handles HTTP requests, enqueues Celery jobs, never
  # calls Gemini directly (that only happens inside the `worker` container).
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host/port from .env (which defaults to localhost for running
      # Django outside Docker) with the docker-compose service names.
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Same image as `web`, different command: a Celery worker process that pulls
  # "review this submission" jobs off the Redis queue and runs them. This is why
  # LLM calls don't block HTTP requests — `web` just enqueues, `worker` executes.
  worker:
    build: .
    command: celery -A ai_code_reviewer worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
